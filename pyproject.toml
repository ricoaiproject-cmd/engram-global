[project]
name = "engram"
version = "0.10.0"
description = "Human-like memory MCP server for AI agents: activation decay, associative recall, error-driven encoding"
requires-python = ">=3.12"
# To reduce install friction, the embedding runtimes are default dependencies.
# The default runtime is ONNX (onnxruntime + tokenizers, ~1-2 s startup).
# sentence-transformers (torch) remains as the fallback when the ONNX model
# has not been exported, and as the parity reference for export-onnx
# (planned to move into extras eventually).
dependencies = [
    "mcp>=1.2",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "python-frontmatter>=1.1",
    "python-ulid>=2.7",
    "sentence-transformers>=3.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
engram = "engram.cli:main"
engram-mcp = "engram.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
